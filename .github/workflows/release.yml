name: Release

# A new version in build.zig.zon on master (or a manual run) builds the Windows package on Linux (agent and gpmf2json
# cross-compiled with Zig, the job pipeline from kneoio/direct360-helper v2.0.4, Node and ffmpeg downloaded), runs the
# smoke test on Windows against it (pair, a preview render, the outdated refusal, the tray app), builds the installer
# and checks it installs, runs and uninstalls, then publishes the installer as the GitHub Release v<version>.
on:
  push:
    branches: [master]
    paths: [build.zig.zon]
  workflow_dispatch:

permissions:
  contents: write

env:
  HELPER_REF: v2.0.4

jobs:
  stage-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kneoio/direct360-helper
          ref: ${{ env.HELPER_REF }}
          path: helper
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: zig build test
      - run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSmall
      - run: node build/stage.mjs --target windows-x64 --helper helper --agent zig-out/bin/direct360-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  smoke-windows:
    needs: stage-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Unzip the package
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath pkg
      - name: Smoke test
        shell: pwsh
        env:
          D360_SMOKE_AGENT: pkg\direct360-agent.exe
        run: |
          node --test test/smoke.test.mjs
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path build.zig.zon -Pattern '\.version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DSourceDir=$PWD\pkg" "/DAppVersion=$version" "/DOutputDir=$PWD\dist" build\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Direct360AgentSetup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Direct360 Agent"
          if (-not (Test-Path "$dir\direct360-agent.exe")) { throw "not installed" }
          $p = Start-Process "$dir\direct360-agent.exe" -ArgumentList 'info' -Wait -PassThru -NoNewWindow -RedirectStandardError info.txt
          Get-Content info.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path info.txt -Pattern '"ffmpeg"')) { throw "the installed agent did not run" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\direct360-agent.exe") { throw "not uninstalled" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Direct360AgentSetup-*.exe

  release:
    needs: smoke-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" dist/*.exe --clobber
          else
            gh release create "v$version" dist/*.exe --target "$GITHUB_SHA" --title "Direct360 agent $version" --notes-file build/release-notes.md
          fi
