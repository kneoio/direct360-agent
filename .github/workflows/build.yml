name: Build

# Unit tests on Linux, then the agent cross-compiled for every system from one runner. The builds are kept as
# workflow artifacts; releases come later.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build test --summary all
      - name: Cross-compile
        run: |
          for t in x86_64-windows aarch64-macos x86_64-macos x86_64-linux aarch64-linux; do
            zig build -Dtarget=$t -Doptimize=ReleaseSmall --prefix out/$t
          done
      - uses: actions/upload-artifact@v4
        with:
          name: direct360-agent
          path: out/
