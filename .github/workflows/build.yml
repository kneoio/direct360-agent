name: Build

# Unit tests on Linux, the agent cross-compiled for every system, the Windows package (agent, Node, ffmpeg and the
# direct360-helper job pipeline) staged on Linux and smoke-tested on Windows, and the Linux .deb built, installed and
# smoke-tested (the tray on a virtual display). Everything is kept as workflow artifacts; publishing a release is the
# separate Release workflow.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # direct360-helper's job pipeline at the commit direct360-server depends on (per-entry camera settings, after the
  # Windows pan fix).
  HELPER_REF: 11261bdc5326e3bdc0d6faa9492b6b007a051e4b

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build test --summary all
      - name: Cross-compile
        run: |
          for t in x86_64-windows aarch64-macos x86_64-macos x86_64-linux-gnu.2.31 aarch64-linux-gnu.2.31; do
            zig build -Dtarget=$t -Doptimize=ReleaseSmall --prefix out/$t
          done
      - uses: actions/upload-artifact@v4
        with:
          name: direct360-agent
          path: out/

  stage-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kneoio/direct360-helper
          ref: ${{ env.HELPER_REF }}
          path: helper
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: zig build test
      - run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSmall
      - run: node build/stage.mjs --target windows-x64 --helper helper --agent zig-out/bin/direct360-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  smoke-windows:
    needs: stage-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Unzip the package
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath pkg
      - name: Smoke test
        shell: pwsh
        env:
          D360_SMOKE_AGENT: pkg\direct360-agent.exe
        run: |
          node --test test/smoke.test.mjs
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path build.zig.zon -Pattern '\.version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DSourceDir=$PWD\pkg" "/DAppVersion=$version" "/DOutputDir=$PWD\dist" build\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Direct360AgentSetup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Direct360 Agent"
          if (-not (Test-Path "$dir\direct360-agent.exe")) { throw "not installed" }
          $p = Start-Process "$dir\direct360-agent.exe" -ArgumentList 'info' -Wait -PassThru -NoNewWindow -RedirectStandardError info.txt
          Get-Content info.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path info.txt -Pattern '"ffmpeg"')) { throw "the installed agent did not run" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\direct360-agent.exe") { throw "not uninstalled" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Direct360AgentSetup-*.exe

  stage-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kneoio/direct360-helper
          ref: ${{ env.HELPER_REF }}
          path: helper
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: zig build test
      - run: zig build -Dtarget=x86_64-linux-gnu.2.31 -Doptimize=ReleaseSmall
      - run: node build/stage.mjs --target linux-x64 --helper helper --agent zig-out/bin/direct360-agent
      - name: Build the .deb
        run: build/linux/deb.sh dist/linux-x64 "$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          compression-level: 0

  smoke-linux:
    needs: stage-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist
      - name: Install the .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ./dist/direct360-agent_*.deb
          test -x /opt/direct360-agent/direct360-agent
          direct360-agent info 2> info.txt
          cat info.txt
          grep -q '"ffmpeg"' info.txt
      - name: Smoke test (the tray on a virtual display)
        env:
          D360_SMOKE_AGENT: /opt/direct360-agent/direct360-agent
        run: xvfb-run -a dbus-run-session -- node --test test/smoke.test.mjs
      - name: Uninstall
        run: |
          sudo apt-get remove -y direct360-agent
          test ! -e /opt/direct360-agent/direct360-agent
